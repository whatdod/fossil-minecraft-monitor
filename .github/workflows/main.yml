name: Fossil Minecraft Monitor

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Invia un messaggio di test su Telegram"
        required: false
        default: "false"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fossil-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check Fossil The End
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: |
          echo "🕐 Controllo eseguito: $(date '+%Y-%m-%d %H:%M:%S UTC')"

          python - <<'PY'
          import os
          import requests
          from playwright.sync_api import sync_playwright

          url = "https://www.fossil.com/it-it/products/cronografo-minecraft-x-fossil-the-end-44-mm-in-edizione-limitata/LE1252.html"

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          def send_telegram(msg):
              response = requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data={
                      "chat_id": chat_id,
                      "text": msg
                  },
                  timeout=30,
              )
              response.raise_for_status()

          # Test manuale Telegram
          if os.environ.get("FORCE_NOTIFY", "false").lower() == "true":
              send_telegram(
                  "🧪 Test manuale: il bot Telegram funziona correttamente."
              )
              print("Messaggio di test inviato.")

          with sync_playwright() as p:

              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  user_agent=(
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/124.0.0.0 Safari/537.36"
                  ),
                  viewport={
                      "width": 1366,
                      "height": 900
                  },
                  locale="it-IT",
              )

              page = context.new_page()

              print("🌐 Apro la pagina Fossil...")

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              # Aspetta eventuali contenuti caricati tramite JavaScript
              try:
                  page.wait_for_load_state(
                      "networkidle",
                      timeout=20000
                  )
              except Exception:
                  pass

              # Prova a chiudere il banner cookie
              for selector in [
                  "#onetrust-accept-btn-handler",
                  "button:has-text('Accetta')",
                  "button:has-text('Accept')",
              ]:
                  try:
                      page.click(
                          selector,
                          timeout=3000
                      )
                      print("🍪 Banner cookie chiuso")
                      break
                  except Exception:
                      continue

              page.wait_for_timeout(3000)

              # Screenshot di debug
              page.screenshot(
                  path="debug_screenshot.png",
                  full_page=True
              )

              text = page.locator("body").inner_text().lower()

              positive = "aggiungi al carrello" in text

              negative_signals = [
                  "esaurito",
                  "temporaneamente non disponibile",
                  "sold out",
                  "avvisami"
              ]

              negative = any(
                  signal in text
                  for signal in negative_signals
              )

              available = positive and not negative

              print("Indicatore positivo trovato:", positive)
              print("Indicatore negativo trovato:", negative)

              if available:
                  print("✅ THE END DISPONIBILE")
              else:
                  print("❌ THE END NON DISPONIBILE")

              # Legge lo stato precedente
              state_file = "fossil_status.txt"

              try:
                  with open(state_file, "r") as f:
                      previous = f.read().strip()
              except FileNotFoundError:
                  previous = "unknown"

              current = (
                  "available"
                  if available
                  else "soldout"
              )

              print(
                  f"Stato precedente: {previous} | "
                  f"Stato attuale: {current}"
              )

              # SOLD OUT
              if previous == "available" and current == "soldout":

                  send_telegram(
                      "🚨 FOSSIL THE END — SOLD OUT!\n\n"
                      "Il pulsante 'Aggiungi al carrello' "
                      "non è più disponibile.\n\n"
                      + url
                  )

                  print("🚨 ALERT SOLD OUT INVIATO")

              # RESTOCK
              elif previous == "soldout" and current == "available":

                  send_telegram(
                      "🟢 FOSSIL THE END — DISPONIBILE!\n\n"
                      "Il prodotto è nuovamente disponibile.\n\n"
                      "CORRI A CONTROLLARE:\n"
                      + url
                  )

                  print("🟢 ALERT RESTOCK INVIATO")

              # Salva lo stato
              with open(state_file, "w") as f:
                  f.write(current)

              browser.close()
          PY

      - name: Upload debug screenshot
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png
          retention-days: 3

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fossil_status.txt

          git diff --cached --quiet || git commit -m "Update Fossil stock status"

          git push
