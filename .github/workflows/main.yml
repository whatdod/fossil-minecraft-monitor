name: Fossil Minecraft Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Check Fossil The End
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from playwright.sync_api import sync_playwright

          url = "https://www.fossil.com/it-it/products/cronografo-minecraft-x-fossil-the-end-44-mm-in-edizione-limitata/LE1252.html"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_timeout(5000)

              text = page.locator("body").inner_text().lower()

              available = "aggiungi al carrello" in text

              if available:
                  print("✅ THE END DISPONIBILE")
              else:
                  print("❌ THE END NON DISPONIBILE")

              state_file = "fossil_status.txt"

              try:
                  with open(state_file, "r") as f:
                      previous = f.read().strip()
              except FileNotFoundError:
                  previous = "unknown"

              current = "available" if available else "soldout"

              print(f"Stato precedente: {previous}")
              print(f"Stato attuale: {current}")

              if previous == "available" and current == "soldout":

                  message = (
                      "🚨 FOSSIL THE END — POSSIBILE SOLD OUT!\n\n"
                      "Il pulsante 'Aggiungi al carrello' non è più presente.\n\n"
                      "Controlla subito:\n" + url
                  )

                  requests.post(
                      f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
                      data={
                          "chat_id": os.environ["CHAT_ID"],
                          "text": message
                      },
                      timeout=30
                  )

                  print("🚨 ALERT SENT")

              elif previous == "soldout" and current == "available":

                  message = (
                      "🟢 FOSSIL THE END — DISPONIBILE!\n\n"
                      "Il pulsante 'Aggiungi al carrello' è nuovamente presente.\n\n"
                      "CORRI A CONTROLLARE:\n" + url
                  )

                  requests.post(
                      f"https://api.telegram.org/bot{os.environ['BOT_TOKEN']}/sendMessage",
                      data={
                          "chat_id": os.environ["CHAT_ID"],
                          "text": message
                      },
                      timeout=30
                  )

                  print("🟢 RESTOCK ALERT SENT")

              with open(state_file, "w") as f:
                  f.write(current)

              browser.close()
          PY

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fossil_status.txt

          git diff --cached --quiet || git commit -m "Update Fossil stock status"

          git push
